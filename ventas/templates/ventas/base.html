<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Control de Ventas{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'ventas/store.css' %}">
</head>
<body>
    <header>
        <a class="brand" href="{% url 'inicio' %}">
            <span class="brand-mark">CV</span>
            <span>
                <strong>Control de Ventas</strong>
                <small>Gestión simple y eficiente</small>
            </span>
        </a>
        <nav>
            <a href="{% url 'producto_list' %}">Ver Productos</a>
            <a class="nav-cta" href="{% url 'producto_create' %}">Añadir Producto</a>
        </nav>
    </header>

    <main class="page-shell">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
